apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  namespace: kulikov
  labels:
    app.kubernetes.io/name: ingress-web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - host: kulikov.klsh.ru
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 80
      
      - path: /info
        pathType: Prefix
        backend:
          service:
            name: info-service
            port:
              number: 80
              
      - path: /login
        pathType: Prefix
        backend:
          service:
            name: login-service
            port:
              number: 80

      - path: /
        pathType: Prefix
        backend:
          service:
            name: root-service
            port:
              number: 80