apiVersion: apps/v1
kind: Deployment
metadata:
  name: root-app
  namespace: kulikov
spec:
  replicas: 2
  selector:
    matchLabels:
      app: root-app
  template:
    metadata:
      labels:
        app: root-app
    spec:
      containers:
      - name: root-container
        image: git.klsh.ru/kulikov/root-service:latest
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 8080
        envFrom:
            - configMapRef:
                name: root-config