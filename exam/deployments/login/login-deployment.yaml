apiVersion: apps/v1
kind: Deployment
metadata:
  name: login-app
  namespace: kulikov
spec:
  replicas: 1
  selector:
    matchLabels:
      app: login-app
  template:
    metadata:
      labels:
        app: login-app
    spec:
      containers:
      - name: login-container
        image: git.klsh.ru/kulikov/login-service:latest
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 8080
        envFrom:
            - configMapRef:
                name: login-config